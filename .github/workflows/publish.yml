# 发布到 npm：Release 发布后自动执行，带 npm provenance（包页面显示 Built and signed on GitHub Actions）。
# 前置：仓库 Settings → Secrets and variables → Actions 里需要 NPM_TOKEN
#       （npm granular token，只给 @verneuil/dsh-ocg-session-head 的 read/write 权限）。
# 若 secret 缺失，本工作流只给黄警告并跳过发布，不会静默"假装发布成功"。
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance 需要 OIDC

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Repository self-checks
        run: node scripts/ci-check.mjs

      - name: Plugin self-test
        run: node scripts/self-test.mjs

      - name: Check whether the npm token is configured
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is not configured — skipping the npm publish step. Add it under Settings → Secrets and variables → Actions to enable provenance publishing."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish when the tag does not match the manifest
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::error::tag $TAG does not match package.json version $MANIFEST"
            exit 1
          fi
          echo "publishing $VERSION"

      - name: Refuse to publish an already published version
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          if npm view "@verneuil/dsh-ocg-session-head@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@verneuil/dsh-ocg-session-head@$VERSION is already on npm; nothing to publish"
            exit 1
          fi

      - name: Publish with provenance
        if: steps.token.outputs.present == 'true'
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarize
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          echo "### Published \`@verneuil/dsh-ocg-session-head@$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "npm page: https://www.npmjs.com/package/@verneuil/dsh-ocg-session-head/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
